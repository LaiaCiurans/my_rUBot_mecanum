amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    use_sim_time: false
    alpha1: 0.3   # Soroll rotacional degut a la rotació (abans 0.2)
    alpha2: 0.3   # Soroll translacional degut a la rotació (abans 0.2)
    alpha3: 0.3   # Soroll translacional degut a la translació (abans 0.2)
    alpha4: 0.3   # Soroll rotacional degut a la translació (abans 0.2)
    alpha5: 0.3   # Soroll relacionat amb errors no gaussians (abans 0.2)
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1 # Desviació estàndard del soroll del "hit" (abans 0.2)
    tf_broadcast: true
    transform_tolerance: 0.3
    update_min_a: 0.1  # Angle mínim per actualitzar (abans 0.2)
    update_min_d: 0.15 # Distància mínima per actualitzar (abans 0.25)
    z_hit: 0.9   # Probabilitat d'un "hit" (abans 0.5)
    z_rand: 0.1 # Probabilitat d'una lectura aleatòria (abans 0.5)
    scan_topic: /scan

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    bt_loop_duration: 100 # abans 10
    default_server_timeout: 100
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    enable_stamped_cmd_vel: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.15, 0.05, 0.45]
    min_velocity: [-0.1, -0.05, -0.45]

    max_accel: [0.8, 0.4, 0.9]
    max_decel: [-0.8, -0.4, -0.9]

    deadband_velocity: [0.005, 0.005, 0.005]

    velocity_timeout: 1.0
    odom_topic: "odom"
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 8.0 #Abans 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 35.0

    general_goal_checker:
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15   # CANVIAT: abans 0.20 (més precisió a la meta)
      yaw_goal_tolerance: 0.50  # CANVIAT: abans 0.35 (~29 graus, més marge d'orientació)

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: -0.1
      min_vel_y: -0.05